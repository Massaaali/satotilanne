name: Päivitä Satotilanne

on:
  schedule:
    # Ajaa klo 04:00 Suomen aikaa, mutta VAIN kuukausina 5-10 (touko-lokakuu)
    - cron: '0 1 * 5-10 *'
  workflow_dispatch:
    # Antaa sinun ajaa tämän myös manuaalisesti napista GitHubissa

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # Annetaan oikeudet tallentaa tiedosto takaisin repositorioosi
    permissions:
      contents: write

    steps:
      - name: Hae koodi (Checkout)
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Asenna riippuvuudet
        run: |
          python -m pip install --upgrade pip
          pip install requests pyproj

      - name: Aja satotilanteen päivitys
        run: python hae_satotilanne.py

      - name: Tallenna muutokset (Commit & Push)
        run: |
          git config --global user.name 'Satotilanne-Botti'
          git config --global user.email 'botti@satotutka.de'
          git add satotilanne.json
          
          # Jos data on muuttunut, tallennetaan se
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automaattinen satopäivitys" && git push)
